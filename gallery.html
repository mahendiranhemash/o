<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories ❤️</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff4d88,#ffc1d9);
text-align:center;
color:white;
}

h1{
padding:20px;
font-size:40px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
padding:20px;
}

.gallery img{
width:100%;
height: 400px;
object-fit:cover;
border-radius:20px;
box-shadow:0 0 20px white;
transition:.4s;
}

.gallery img:hover{
transform:scale(1.08);
}

button{
margin:30px;
padding:15px 30px;
font-size:18px;
border:none;
border-radius:30px;
background:white;
color:#ff2d75;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<h1>📸 Our Beautiful Memories ❤️</h1>

<div class="gallery">
<img src="1000116878.jpg">
<img src="1000116879.jpg">
<img src="1000116880.jpg">
<img src="1000116881.jpg">
</div>

<p style="font-size:22px;padding:20px;">
Every picture tells a story, and every story reminds me how lucky I am to have you, Richa. ❤️
</p>

<button onclick="location.href='memory.html'">
🫙 Open Memory Jar
</button>

</body>
</html>
