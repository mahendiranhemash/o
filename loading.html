<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading Love...</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff4d88,#ff99cc);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
}

.loader{
text-align:center;
}

.loader h1{
font-size:40px;
animation:beat 1s infinite;
}

.loader p{
margin-top:20px;
font-size:20px;
}

.bar{
width:280px;
height:18px;
background:white;
border-radius:20px;
margin:25px auto;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:#ff0055;
animation:load 5s linear forwards;
}

@keyframes load{
from{width:0%;}
to{width:100%;}
}

@keyframes beat{
0%,100%{transform:scale(1);}
50%{transform:scale(1.2);}
}
</style>

<script>
setTimeout(()=>{
window.location="password.html";
},5000);
</script>

</head>

<body>

<div class="loader">
<h1>❤️ Loading Love ❤️</h1>

<div class="bar">
<div class="fill"></div>
</div>

<p>Preparing something special for Richa...</p>

</div>

</body>
</html>
