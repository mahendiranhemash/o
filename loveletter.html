<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Letter ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff4d88,#ff99cc);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.card{
width:90%;
max-width:600px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 0 30px rgba(255,255,255,.5);
text-align:center;
}

h1{
color:#ff2d75;
margin-bottom:20px;
}

#letter{
color:#444;
font-size:20px;
line-height:1.8;
min-height:280px;
}

button{
margin-top:20px;
padding:14px 28px;
background:#ff2d75;
color:white;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<h1>💌 Dear Richa ❤️</h1>

<p id="letter"></p>

<button onclick="location.href='surprise.html'">
🎁 Open My Surprise
</button>

</div>

<script>

const message=`Dear Richa,

Happy Girlfriend Day! ❤️

Thank you for bringing happiness, love, and countless beautiful memories into my life.

Every smile of yours makes my heart happier.
Every moment with you is a gift that I will always treasure.

No matter where life takes us, you will always have a special place in my heart.

I wish we create many more beautiful memories together.

Forever Yours,
❤️ Hemash ❤️`;

let i=0;

function typeWriter(){

if(i<message.length){

document.getElementById("letter").innerHTML+=message.charAt(i);

i++;

setTimeout(typeWriter,40);

}

}

typeWriter();

</script>

</body>
</html>
