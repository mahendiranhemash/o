<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlock My Heart ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff4d88,#ff99cc);
color:white;
}

.box{
background:rgba(255,255,255,.15);
padding:30px;
border-radius:20px;
text-align:center;
backdrop-filter:blur(10px);
width:320px;
}

h1{
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
font-size:18px;
margin:15px 0;
text-align:center;
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
background:white;
color:#ff2d75;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

#error{
margin-top:15px;
color:yellow;
font-size:16px;
}
</style>
</head>

<body>

<div class="box">
<h1>🔒 Unlock My Heart ❤️</h1>

<p>Enter the secret password</p>

<input
id="pass"
type="password"
placeholder="Password">

<button onclick="checkPassword()">
Unlock 💖
</button>

<p id="error"></p>
</div>

<script>
function checkPassword(){

let password =
document.getElementById("pass").value;

if(password.toUpperCase()=="RICHA"){

window.location="index.html";

}else{

document.getElementById("error").innerHTML=
"❌ Wrong Password! Try: RICHA";

}

}
</script>

</body>
</html>
